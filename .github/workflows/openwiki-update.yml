name: OpenWiki Update

on:
  # Automatic triggers are disabled by decision (2026-10-01).
  #
  # Every automated run failed without writing a single page: the OpenAI-compatible
  # gateway (plusvibeapi.ru) answered the generation request with an nginx
  # "504 Gateway Time-out" after ~50 minutes of hanging, so the run produced zero
  # pages, zero pull requests, and burned ~1 runner-hour plus gateway tokens per
  # push to master. See the failure runs 36913331737, 36901545549, 36451310820.
  #
  # Manual dispatch stays available. Regenerate the wiki deliberately from a local
  # checkout instead of paying a CI runner to fail on every commit.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so `openwiki code --update` can diff HEAD against the
          # commit it last documented; a shallow clone hides that commit and the
          # update runs against an empty change summary.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        # mermaid + jsdom are optional; they add high-fidelity validation of Mermaid diagrams. Remove if your wiki has none.
        run: npm install --global openwiki@0.6.0 mermaid@11.16.0 jsdom@29.1.1

      - name: Run OpenWiki
        id: openwiki
        continue-on-error: true
        run: openwiki code --update --print
        env:
          # Our own cheap gateway (OpenAI-compatible). No paid OpenAI key needed.
          # Secret PLUSVIBE_API_KEY must be set in repo settings (Elli's hands).
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_BASE_URL: https://plusvibeapi.ru/v1
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.PLUSVIBE_API_KEY }}
          OPENWIKI_MODEL_ID: "qwen3.8-flash"

      - name: Remove transient OpenWiki run state
        if: ${{ !cancelled() }}
        run: rm -f -- openwiki/.run.json

      - name: Create OpenWiki update pull request
        id: create-pr
        if: ${{ !cancelled() }}
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
            .github/workflows/openwiki-update.yml
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            OpenWiki result: ${{ steps.openwiki.outcome }}

            When the result is `failure`, this PR intentionally preserves only the
            pages completed before the failure. Merge it to make that progress the
            baseline for the next scheduled run.

      - name: Annotate OpenWiki update pull request
        if: ${{ !cancelled() && steps.create-pr.outputs.pull-request-url != '' }}
        run: echo "::notice title=OpenWiki update pull request::${{ steps.create-pr.outputs.pull-request-url }}"

      - name: Propagate OpenWiki failure
        if: ${{ steps.openwiki.outcome == 'failure' }}
        run: exit 1
