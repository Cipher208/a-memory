name: Release Drafter

# Pull requests only, deliberately.
#
# This workflow used to also run on every push to master, which is exactly when a
# release is being published. It then created a release object for the tag being
# released, and the Release workflow — which publishes the body from CHANGELOG.md —
# was left choosing between two objects for one tag. On v1.12.0 it picked the
# drafter's, and the published body was generated notes while the workflow that
# wrote it documents that it comes from the changelog. Two writers for one
# artifact; this removes the second one. The draft itself is described as "a
# working aid only" in its own template below, and PR activity is where the
# information for it comes from anyway.
on:
  pull_request:
    types: [opened, reopened, synchronize]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
