name: Release

on:
  push:
    tags:
      - 'v*'

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Build
        run: |
          pip install build
          python -m build

      # The release body comes from CHANGELOG.md, never from generated notes.
      # `generate_release_notes` built it out of PR titles and authors, which
      # put a real committer identity into a public release. Notes written by
      # hand in the CHANGELOG say what changed and why; a list of who touched
      # it says neither. Failing here when the section is missing is
      # deliberate — an empty body is better than a silently generated one,
      # and the tag would be mis-built anyway.
      - name: Take the release body from CHANGELOG.md
        run: |
          python - "${{ github.ref_name }}" > RELEASE_BODY.md <<'PY'
          import re, sys
          tag = sys.argv[1].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
                        text, re.M | re.S)
          if not m:
              sys.exit(f"CHANGELOG.md has no '## [{tag}]' section — add one before tagging")
          print(m.group(1).strip())
          PY
          test -s RELEASE_BODY.md

      # A second release object for the same tag is not harmless, and v1.12.0 is
      # the proof: the publish step picks the release by tag, two existed (a stale
      # draft from an earlier release-drafter run and a fresh one), and the object
      # it adopted carried the drafter's generated notes instead of the
      # RELEASE_BODY.md this workflow just wrote. The release page then contradicted
      # the changelog it is supposed to quote.
      #
      # This runs BEFORE the PyPI upload on purpose. A tag that is already released
      # must fail while nothing irreversible has happened — failing after the upload
      # would leave a package on PyPI that no re-run can publish again, since the
      # version would already exist.
      - name: Refuse a tag that is already released, and clear stale drafts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # `gh release list --json` has no id field on the runner's gh version, and
          # asking for one returns an empty result rather than an error — which would
          # make this guard report "clean start" on a tag that is already released.
          # Measured, not assumed: that is how the first version of this step behaved.
          # The REST API carries both id and draft, so the guard reads it directly.
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            -q ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"")
          if [ -z "$existing" ]; then
            echo "no existing release for $TAG: clean start"
            exit 0
          fi
          if printf '%s\n' "$existing" | grep -q ' false$'; then
            echo "::error::release $TAG is already published — bump the version instead of re-tagging"
            exit 1
          fi
          printf '%s\n' "$existing" | while read -r id _; do
            echo "deleting stale draft for $TAG (id $id) so the publish step cannot adopt it"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id"
          done

      # Publish to PyPI BEFORE announcing the release, on purpose.
      #
      # 1.11.0 taught this the hard way: the order was release-then-upload, the
      # upload was refused, and the result was a published GitHub Release whose
      # package did not exist on PyPI. Anyone reading the release page had no way
      # to know the install command would fail with "No matching distribution".
      # A failure here now stops the announcement; the reverse mistake — a package
      # uploaded but not announced — is recoverable by re-running the job.
      - name: Publish to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          pip install twine
          twine upload --non-interactive --config-file /dev/null -u __token__ -p "$PYPI_TOKEN" dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE_BODY.md
