name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
      - uses: astral-sh/setup-uv@v5
      - name: Verify uv.lock is in sync with pyproject.toml
        run: uv lock --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra dev --extra binary --python 3.12
      - run: uv run mypy --config-file pyproject.toml features/ shared/ mcp_server/ rag/ hooks/ wiki/ lifecycle/ graph/ core/

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      # Pinned deliberately. 4.48.0 replaced the `grade` block with an `assessment`
      # object that carries no single letter (coverage / dead_code / maintainability /
      # risk), so the check below cannot read a grade from it at all — and an unpinned
      # `pip install` took that release silently, turning this required check red on
      # master and on every open branch. Pin until the gate is migrated on purpose;
      # a release must not be able to change what this check means.
      - run: pip install "skylos==4.47.2"
      - run: skylos . --json --no-provenance
      - name: Check grade
        run: |
          GRADE=$(skylos . --json --no-provenance | python -c "import json,sys; d=json.load(sys.stdin); g=d.get('grade') or sys.exit('skylos JSON carries no grade block (keys: ' + ','.join(sorted(d)) + ')'); print(g['overall']['letter'])")
          echo "Skylos grade: $GRADE"
          if [ "$GRADE" = "F" ] || [ "$GRADE" = "D" ] || [ "$GRADE" = "D+" ]; then
            echo "Grade too low: $GRADE"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - uses: astral-sh/setup-uv@v5
      # Seed pip into the venv: scripts/install_ner_models.py shells out to
      # `sys.executable -m pip install <wheel URLs>`, and a uv-created venv
      # has no pip otherwise. `uv sync` keeps the seeded pip, and the pip
      # cache (setup-python `cache: pip`) keeps the model wheels warm.
      - run: uv venv --seed --python ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev --extra binary --python ${{ matrix.python-version }}
      - run: uv run python scripts/install_ner_models.py
      - run: uv run pytest tests/ -v --tb=long --timeout=30 -n auto

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --seed --python 3.12  # NER installer needs pip in the venv
      - run: uv sync --locked --extra dev --extra binary --python 3.12
      - run: uv run python scripts/install_ner_models.py
      - run: uv run pytest tests/ -n auto --cov=features --cov=shared --cov=core --cov=rag --cov=wiki --cov=graph --cov=lifecycle --cov=hooks --cov=mcp_server --cov-report=xml --cov-report=term-missing --cov-fail-under=60 --timeout=60
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: coverage.xml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install pip-audit
      - run: pip-audit --strict --desc --skip-editable

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra docs --python 3.12
      - name: Build docs (strict — fails on broken refs)
        run: uv run mkdocs build --strict
