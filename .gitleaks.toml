# gitleaks configuration — mcp-ariel-memory
#
# Why this file exists.
#
# The default ruleset finds credentials. It structurally cannot find the other
# half of what this repository can leak: fixture rows that pin real close-out
# broadcasts from a live operator's history. One of those rows described a
# private host — node names, a tailnet address, the ssh user, a key path, an
# API-key variable name, tunnel parameters and ports. There is no credential
# shape in any of that: it is made of names, paths and roles, so gitleaks had
# nothing to match and the CI scan went green on a tree that already contained it.
#
# These rules are the house layer for infrastructure disclosure.
#
# DESIGN CONSTRAINT — read before extending.
#
# This file is committed to a public repository, so it is itself published. A
# rule that names one of our hosts publishes that host, and a "regression pin"
# listing the exact identifiers would re-leak the very thing it guards. The
# first draft of this file did exactly that. Therefore:
#
#   no rule below contains a literal hostname, address, account, key name or
#   persona handle of this house. Every rule describes a SHAPE — "this is what a
#   tailnet address looks like", "this is what a private key path looks like" —
#   and a shape is safe to publish while still being specific enough to fire.
#
# Rules matching our literal identifiers, if ever wanted, belong in an untracked
# local overlay, never here. The generic rules below are what caught the real
# incident (six of them fire on it); literal pins were never the value.
#
# Deliberately NOT matched: generic RFC 1918 addresses. Examples, docker config
# and tests in this repository use 10.x legitimately, and a rule that cries wolf
# gets muted. See CONTRIBUTING.md § Test Data and Fixtures.

[extend]
# Keep every default rule. This adds a layer; it does not trade one for another.
useDefault = true

[[rules]]
id = "house-tailscale-cgnat"
description = "Tailscale / CGNAT address (100.64.0.0/10) — a private tailnet node"
regex = '''\b100\.(?:6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.\d{1,3}\.\d{1,3}\b'''
keywords = ["100."]
tags = ["house", "infrastructure"]

[[rules]]
id = "house-tailnet-fqdn"
description = "Tailnet DNS name (*.ts.net) — names the private network"
regex = '''\b[a-z0-9][a-z0-9-]*\.ts\.net\b'''
keywords = [".ts.net"]
tags = ["house", "infrastructure"]

[[rules]]
id = "house-vps-hostname"
description = "Provider-side machine id (vm followed by 6-9 digits)"
regex = '''\bvm\d{6,9}\b'''
keywords = ["vm"]
tags = ["house", "infrastructure"]

[[rules]]
id = "house-operator-domain"
description = "Hostname-style mail/URL domain under a personal zone (*.cloud.<tld>)"
regex = '''\b[a-z0-9][a-z0-9.-]*\.cloud\.[a-z]{2,}\b'''
keywords = [".cloud."]
tags = ["house", "infrastructure"]

[[rules]]
id = "house-ssh-backup-user"
description = "Backup ssh account, in ssh context or as user@host"
regex = '''(?:ssh|scp|sftp|rsync)\s+(?:-\S+\s+|\S+\s+){0,3}backup-[a-z][a-z0-9_-]{2,}\b|\bbackup-[a-z][a-z0-9_-]{2,}@'''
keywords = ["backup-"]
tags = ["house", "access"]

[[rules]]
id = "house-ssh-key-path"
description = "Private key path under .ssh/ — pairs a key artifact with where it lives"
regex = '''(?:~|/(?:home|root))/?(?:[\w.-]+/)*\.ssh/[\w.-]*(?:key|pem|p12)\b'''
keywords = [".ssh/"]
tags = ["house", "access"]

[[rules]]
id = "house-secret-var-name"
description = "Name of a secret-bearing env var (FOO_API_KEY) — the name alone maps the perimeter"
regex = '''\b[A-Z][A-Z0-9]{2,}_API_KEY\b'''
keywords = ["_API_KEY"]
tags = ["house", "access"]

[[rules.allowlists]]
description = "A workflow that names its own secret (secrets.FOO_API_KEY) discloses nothing about a host — GitHub holds the value. The rule exists for names appearing in fixtures and docs, where a name sits next to a real machine."
paths = ['''\.github/workflows/''']

[[rules]]
id = "house-amneziawg-params"
description = "AmneziaWG obfuscation parameters (Jc/Jmin/Jmax) — a tunnel fingerprint"
regex = '''\b(?:Jc|Jmin|Jmax)\s*=\s*\d{1,4}\b'''
keywords = ["Jc", "Jmin", "Jmax"]
tags = ["house", "infrastructure"]

[[rules]]
id = "house-amneziawg-config-path"
description = "AmneziaWG interface config path"
regex = '''/etc/amneziawg/[\w.-]+\.conf'''
keywords = ["/etc/amneziawg/"]
tags = ["house", "infrastructure"]

[[rules]]
id = "house-tunnel-key-material"
description = "WireGuard/AmneziaWG key material (base64, 44 chars) on a key= line"
regex = '''(?i)\b(?:private|preshared)[-_]?key\s*=\s*[A-Za-z0-9+/]{43}='''
keywords = ["privatekey", "presharedkey", "preshared"]
tags = ["house", "access"]
